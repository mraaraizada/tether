name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Runs offline: no API key, no network. Covers parsing (including
      # malformed transcripts), the citation-verification gate, retrieval
      # ranking and accuracy, and cache-key sensitivity.
      - name: Tests
        run: npm run verify

      - name: Build
        run: npm run build
