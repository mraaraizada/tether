# Render blueprint: one long-running API service plus a static site.
# Render has no per-request timeout, so every pipeline calls the model live —
# including cross-call analysis, which takes ~120s and would be cut off by a
# serverless platform's request ceiling.
services:
  - type: web
    name: tether-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace @tether/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: OPENAI_BASE_URL
        value: https://router.huggingface.co/v1
      - key: OPENAI_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507
      - key: OPENAI_API_KEY
        sync: false # set this in the Render dashboard, never in the repo
      # Full origin including https://, e.g. https://tether-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: CACHE_DIR
        value: /tmp/tether-cache

  - type: web
    name: tether-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      # Full URL including https://, e.g. https://tether-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
